<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regails - Loading</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,-50..200" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Google Sans", sans-serif;
            overflow: hidden;
        }

        :root {
            --header1: #191919;
            --header2: #141212;
            --pcolor: #ECA438;
        }

        /* ================= LOADER ================= */

        .loader-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            background: var(--header2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity .8s ease, visibility .8s ease;
            overflow: hidden;
        }

        .loader-screen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* soft ambient glow in the background */
        .loader-screen::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(236, 164, 56, 0.15), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .7; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        /* logo + spinning ring */
        .loader-logo-wrap {
            position: relative;
            height: 110px;
            width: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 35px;
        }

        .loader-logo-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(236, 164, 56, 0.15);
        }

        .loader-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--pcolor);
            border-right-color: var(--pcolor);
            animation: ringSpin 1.4s linear infinite;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        .loader-logo-icon {
            font-size: 40px;
            color: var(--pcolor);
            animation: iconPulse 1.6s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .loader-brand {
            font-size: 26px;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeInUp .7s ease forwards;
            animation-delay: .2s;
        }

        .loader-brand span {
            color: var(--pcolor);
        }

        .loader-tagline {
            font-size: 14px;
            color: #9a9a9a;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp .7s ease forwards;
            animation-delay: .35s;
        }

        /* progress bar */
        .loader-bar-track {
            width: 260px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp .7s ease forwards;
            animation-delay: .5s;
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--pcolor);
            border-radius: 10px;
            transition: width .25s ease-out;
        }

        .loader-percent {
            margin-top: 14px;
            font-size: 13px;
            color: #b8b8b8;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeInUp .7s ease forwards;
            animation-delay: .6s;
        }

        .loader-percent span {
            color: var(--pcolor);
            font-weight: 600;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        
    </style>
</head>
<body>

    <!-- ================= LOADER (this is the reusable part) ================= -->
    <div class="loader-screen" id="pageLoader">
        <div class="loader-logo-wrap">
            <span class="loader-ring"></span>
            <i class="fa-solid fa-scale-balanced loader-logo-icon"></i>
        </div>

        <h1 class="loader-brand"><img src="./src/logo.webp" alt="" style="width: 170px;"></h1>
        <p class="loader-tagline">Legal Consultancy</p>

        <div class="loader-bar-track">
            <div class="loader-bar-fill" id="loaderBarFill"></div>
        </div>
        <p class="loader-percent"><span id="loaderPercentNum">0</span>%</p>
    </div>

    <!-- ================= Page content sits behind the loader ================= -->
    <div class="demo-page">
        <span class="material-symbols-outlined">gavel</span>
        <h1>Welcome To <span>Regails</span></h1>
        <p>This is your page content. The loader above sits on top of it and fades away automatically once loading is complete.</p>
    </div>

    <script>
        const loader = document.getElementById("pageLoader");
        const barFill = document.getElementById("loaderBarFill");
        const percentNum = document.getElementById("loaderPercentNum");

        let progress = 0;

        function updateProgress() {
            // random-ish increment so it doesn't feel robotic
            progress += Math.random() * 12 + 4;
            if (progress >= 100) {
                progress = 100;
            }

            barFill.style.width = progress + "%";
            percentNum.textContent = Math.floor(progress);

            if (progress < 100) {
                setTimeout(updateProgress, 180);
            } else {
                setTimeout(() => {
                    loader.classList.add("hide");
                }, 400);
            }
        }

        window.addEventListener("load", () => {
            updateProgress();
        });
    </script>

</body>
</html>
